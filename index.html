<script>
// =====================================================================
// STANDALONE (GitHub Pages) — no login. The facilitator's browser hosts the
// Live Quiz room over PeerJS; phones join with a 4-digit room code / QR.
// Emulates the small part of CAP.db / CAP.room that Live Quiz uses.
// =====================================================================
(()=>{
  if(!window.LQ_STANDALONE)return;
  const PFX="leanquest-room-";
  let peer=null,isHost=false,conns=[],hostConn=null,code=null,myId="host",peersMap={},retry=null;
  const subs={},store={},peerSubs=[];let peersList=[],myPres={};
  const clone=o=>JSON.parse(JSON.stringify(o));
  const snap=path=>{const d=store[path];return {exists:!!d,id:path.split("/").pop(),data:()=>d,metadata:{}}};
  const notify=path=>(subs[path]||[]).forEach(cb=>{try{cb(snap(path))}catch(e){console.error(e)}});
  const broadcast=msg=>conns.forEach(c=>{try{if(c.open)c.send(msg)}catch(e){}});
  const db={doc(path){return {path,
    get:async()=>snap(path),
    set:async d=>{if(!isHost)throw {code:"invalid_argument"};store[path]=clone(d);notify(path);if(path==="live/state")broadcast({t:"state",d:store[path]})},
    update:async d=>{if(!isHost)throw {code:"invalid_argument"};store[path]=Object.assign({},store[path]||{},clone(d));notify(path);if(path==="live/state")broadcast({t:"state",d:store[path]})},
    onSnapshot(cb){(subs[path]=subs[path]||[]).push(cb);setTimeout(()=>cb(snap(path)),0);return()=>{subs[path]=(subs[path]||[]).filter(x=>x!==cb)}}}},
    collection(){return {onSnapshot(cb){setTimeout(()=>cb({docs:[]}),0);return()=>{}}}}};
  function buildList(entries){peersList=entries.map(([id,pres])=>({peer:id,presence:pres||{},isMe:id===myId,sameTab:id===myId,kind:"viewer",by:null,guest:false,updatedAt:Date.now()}));
    peerSubs.forEach(cb=>{try{cb({peers:peersList,joined:[],left:[],updated:[]})}catch(e){console.error(e)}})}
  function hostPeersChanged(){const e=Object.entries(peersMap);buildList(e);broadcast({t:"peers",l:e})}
  const room={presence:async p=>{Object.keys(p).forEach(k=>{if(p[k]===null)delete myPres[k];else myPres[k]=p[k]});
      if(isHost){peersMap[myId]=clone(myPres);hostPeersChanged()}else if(hostConn&&hostConn.open)hostConn.send({t:"pres",d:myPres})},
    onPeers(cb){peerSubs.push(cb);setTimeout(()=>cb({peers:peersList,joined:[],left:[],updated:[]}),0);return()=>{}},
    peers:()=>peersList,connected:()=>!!(isHost||(hostConn&&hostConn.open)),
    join:()=>Promise.reject({code:"not_permitted"})};
  function attach(host){
    CAP.db=db;CAP.room=room;CAP.canEdit=host;CAP.ready=true;ROLE=host?"host":"player";
    db.doc("live/state").onSnapshot(s=>{LIVE=s.exists?s.data():null;onLiveState()});
    room.onPeers(ch=>{PEERS=ch.peers;renderLive()});
    netBar();renderLive(true);
  }
  function netBar(){let b=$("netBar");if(!b){b=document.createElement("div");b.id="netBar";$("liveBox").before(b)}
    if(isHost){const url=location.origin+location.pathname+"#j"+code;
      b.innerHTML=`<div class="net-bar"><div><span class="label">รหัสห้อง${window.TR_PRESET?" · "+esc(TR_liveSet(window.TR_PRESET.src.split(":")[1]).title):""}</span><b class="net-code">${code}</b><small>ผู้เรียนเปิด <span class="net-url">${esc(url)}</span> หรือสแกน QR</small></div><div id="netQR" class="net-qr"></div><span class="chip" id="netCount">เชื่อมต่อ 0 เครื่อง</span></div>`;
      try{new QRCode($("netQR"),{text:url,width:132,height:132,correctLevel:QRCode.CorrectLevel.M})}catch(e){$("netQR").textContent=""}}
    else b.innerHTML=`<div class="net-bar"><div><span class="label">เชื่อมต่อห้อง</span><b class="net-code">${code}</b></div><span class="chip" id="netCount">${hostConn&&hostConn.open?"เชื่อมต่อแล้ว":"กำลังเชื่อมต่อ…"}</span></div>`}
  function setCount(){const e=$("netCount");if(e)e.textContent=isHost?`เชื่อมต่อ ${conns.filter(c=>c.open).length} เครื่อง`:(hostConn&&hostConn.open?"เชื่อมต่อแล้ว":"หลุดการเชื่อมต่อ กำลังต่อใหม่…")}
  function msg(t){const m=$("netMsg");if(m)m.textContent=t}
  function openHost(){if(typeof Peer==="undefined")return msg("โหลดระบบเชื่อมต่อไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต");
    let last="";try{last=sessionStorage.getItem("lq-last-code")||""}catch(e){}do{code=String(Math.floor(1000+Math.random()*9000))}while(code===last);try{sessionStorage.setItem("lq-last-code",code)}catch(e){}msg("กำลังเปิดห้อง…");
    peer=new Peer(PFX+code);
    peer.on("open",()=>{isHost=true;myId="host";attach(true)});
    peer.on("error",e=>{if(e.type==="unavailable-id"){peer.destroy();openHost()}else msg("เปิดห้องไม่สำเร็จ ("+e.type+")")});
    peer.on("connection",cn=>{conns.push(cn);
      cn.on("open",()=>{cn.send({t:"state",d:store["live/state"]||null});cn.send({t:"peers",l:Object.entries(peersMap)});setCount()});
      cn.on("data",m=>{if(m&&m.t==="pres"&&m.d&&typeof m.d==="object"){peersMap[cn.peer]=m.d;hostPeersChanged()}});
      const gone=()=>{conns=conns.filter(x=>x!==cn);delete peersMap[cn.peer];hostPeersChanged();setCount()};
      cn.on("close",gone);cn.on("error",gone)});
    peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}})}
  function joinRoom(c){if(typeof Peer==="undefined")return msg("โหลดระบบเชื่อมต่อไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต");
    code=String(c).replace(/\D/g,"").slice(0,4);if(code.length!==4)return msg("ใส่รหัสห้อง 4 หลัก");msg("กำลังเชื่อมต่อห้อง "+code+"…");
    if(!peer){peer=new Peer();peer.on("open",id=>{myId=id;connect()});peer.on("error",e=>{if(e.type==="peer-unavailable")msg("ไม่พบห้อง "+code+" ตรวจรหัสอีกครั้ง หรือให้วิทยากรเปิดห้องก่อน");else msg("เชื่อมต่อไม่สำเร็จ ("+e.type+")")})}else connect()}
  function connect(){hostConn=peer.connect(PFX+code,{reliable:true});
    hostConn.on("open",()=>{clearInterval(retry);retry=null;if(!CAP.db)attach(false);else{netBar()}if(Object.keys(myPres).length)hostConn.send({t:"pres",d:myPres});setCount()});
    hostConn.on("data",m=>{if(!m)return;if(m.t==="state"){if(m.d)store["live/state"]=m.d;else delete store["live/state"];notify("live/state")}if(m.t==="peers")buildList(m.l||[])});
    hostConn.on("close",()=>{setCount();if(!retry)retry=setInterval(()=>{if(!hostConn||!hostConn.open)connect()},3000)})}
  // connection screen replaces the "needs login" notice
  SKEL.na=()=>`<div class="net-start"><div class="card"><span class="label">วิทยากร · คอมที่ต่อโปรเจกเตอร์</span><h2>เปิดห้อง Live Quiz</h2><p>ได้รหัสห้อง 4 หลักและ QR ให้ผู้เรียนสแกน เปิดหน้านี้ค้างไว้ตลอดเกม</p><button class="btn go" id="netHost">เปิดห้อง →</button></div>
    <div class="card"><span class="label">ผู้เรียน · มือถือ</span><h2>เข้าร่วมด้วยรหัสห้อง</h2><form id="netJoin" style="display:grid;gap:10px"><label class="field">รหัสห้อง 4 หลัก<input id="netCode" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(PENDING||"")}"></label><button class="btn" type="submit">เข้าร่วม →</button></form></div>
    <p class="label" id="netMsg" style="text-transform:none;letter-spacing:0"></p></div>`;
  BIND.na=()=>{$("netHost").onclick=openHost;$("netJoin").onsubmit=e=>{e.preventDefault();joinRoom($("netCode").value)};if(PENDING){const p=PENDING;PENDING=null;joinRoom(p)}};
  let PENDING=null;const m=/^#j(\d{4})$/.exec(location.hash);if(m){PENDING=m[1];setTimeout(()=>{show("scrLive");renderLive(true)},50)}
  const hm=/^#host(?:-(g1|g2|quiz))?$/.exec(location.hash);
  if(hm){if(hm[1])window.TR_PRESET={src:"train:"+hm[1],t:hm[1]==="quiz"?"20":"30"};setTimeout(()=>{show("scrLive");renderLive(true);openHost()},50)}
  window.LQ_openHost=()=>{if(!peer)openHost()};
  // ---- center screen room for the sim games (center screen = host) ----
  const FPX="leanquest-fac-";
  window.LQ_SIMROOM={
    host(onChange){return new Promise((res,rej)=>{if(typeof Peer==="undefined")return rej("โหลดระบบเชื่อมต่อไม่สำเร็จ");const conns=new Map();let pr;
      const open=()=>{const code=String(Math.floor(1000+Math.random()*9000));pr=new Peer(FPX+code);
        pr.on("open",()=>res({code,leave(){try{pr.destroy()}catch(e){}},broadcast(m){conns.forEach(c=>{try{if(c.open)c.send(m)}catch(e){}})}}));
        pr.on("error",e=>{if(e.type==="unavailable-id"){pr.destroy();open()}else if(!conns.size)rej(e.type)});
        pr.on("connection",cn=>{conns.set(cn.peer,cn);cn.on("data",m=>{if(m&&m.t==="pres"&&m.d&&typeof m.d==="object")onChange({peers:[{peer:cn.peer,presence:m.d}],left:[]})});
          const gone=()=>{conns.delete(cn.peer);onChange({peers:[],left:[{peer:cn.peer}]})};cn.on("close",gone);cn.on("error",gone)});
        pr.on("disconnected",()=>{try{pr.reconnect()}catch(e){}})};open()})},
    join(code){return new Promise((res,rej)=>{if(typeof Peer==="undefined")return rej("nopeer");const pr=new Peer();let cn=null,last=null,rankCb=null,ctlCb=null,dead=false,myId="";
      const connect=()=>{if(dead)return;cn=pr.connect(FPX+code,{reliable:true});cn.on("open",()=>{if(last)cn.send({t:"pres",d:last})});cn.on("data",m=>{if(!m)return;if(m.t==="rank"){if(rankCb)rankCb(m.l||[]);if(m.c&&ctlCb)ctlCb(m.c)}if(m.t==="ctl"&&ctlCb)ctlCb(m.c)});cn.on("close",()=>setTimeout(connect,3000))};
      pr.on("open",id=>{myId=id;connect();res({id:()=>myId,presence:d=>{last=d;try{if(cn&&cn.open)cn.send({t:"pres",d})}catch(e){}return Promise.resolve()},onRank(cb){rankCb=cb},onCtl(cb){ctlCb=cb},leave(){dead=true;try{pr.destroy()}catch(e){}}})});
      pr.on("error",e=>{if(e.type==="peer-unavailable"){setTimeout(connect,5000)}else if(!myId)rej(e.type)})})}
  };
  if(window.SIMHUB)setTimeout(()=>SIMHUB.open(),0);// hub may have opened before this script: join the center-screen room now
  setInterval(setCount,2000);
  window.addEventListener("beforeunload",e=>{if(isHost&&conns.length){e.preventDefault();e.returnValue=""}});
})();

</script>
