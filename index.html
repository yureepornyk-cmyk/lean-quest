<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lean Quest</title><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: shop-floor control board — floor-tape header, stages drawn as a Value Stream Map, andon-tower timer */
:root{
  --bg:#eceff2; --surface:#fbfbfa; --sunk:#e1e5ea; --ink:#1b222a; --muted:#5a6470; --line:#c6ccd3;
  --tape:#f2b705; --tape-ink:#1b222a; --blue:#2356a3; --blue-soft:#dbe5f4;
  --go:#1d9152; --go-soft:#d9f0e2; --warn:#c98f00; --warn-soft:#fbefc8; --stop:#cf3a2e; --stop-soft:#f8dcd9;
  --lamp-off:#cfd4da;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181d; --surface:#1d232a; --sunk:#262d35; --ink:#e7eaee; --muted:#9aa4ae; --line:#353e48;
  --tape:#f2b705; --tape-ink:#14181d; --blue:#7aa2e8; --blue-soft:#24324a;
  --go:#3cc477; --go-soft:#173826; --warn:#f0b429; --warn-soft:#3a3016; --stop:#f0675a; --stop-soft:#3d1f1c;
  --lamp-off:#3a434d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181d; --surface:#1d232a; --sunk:#262d35; --ink:#e7eaee; --muted:#9aa4ae; --line:#353e48;
  --tape:#f2b705; --tape-ink:#14181d; --blue:#7aa2e8; --blue-soft:#24324a;
  --go:#3cc477; --go-soft:#173826; --warn:#f0b429; --warn-soft:#3a3016; --stop:#f0675a; --stop-soft:#3d1f1c;
  --lamp-off:#3a434d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.mark{width:42px;height:42px;display:grid;place-items:center;background:var(--tape);color:var(--tape-ink);font-family:var(--f-display);font-weight:700;border-radius:4px}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.06em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:13px}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.chip.xp{background:var(--ink);color:var(--bg);border-color:var(--ink);font-family:var(--f-mono)}
.tape{height:10px;margin:14px 0 28px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,var(--tape-ink) 14px 28px)}

/* home */
.hero{display:grid;gap:10px;margin-bottom:28px;max-width:68ch}
.hero h1{font-size:clamp(28px,5vw,44px)}
.hero p{color:var(--muted)}
.step{margin-bottom:26px}
.step-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.step-h h2{font-size:20px}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{display:grid;gap:6px;height:100%;padding:16px;border:2px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.choice label:hover{border-color:var(--muted)}
.choice input:checked+label{border-color:var(--blue);background:var(--blue-soft)}
.choice input:focus-visible+label{outline:3px solid var(--blue);outline-offset:2px}
.choice .t{font-family:var(--f-display);font-weight:700;font-size:20px;display:flex;justify-content:space-between;gap:8px}
.choice .d{color:var(--muted);font-size:14px}
.choice .spec{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.choice .spec span{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border-radius:4px;padding:2px 8px}
.lvl-bar{display:flex;gap:3px}
.lvl-bar i{width:8px;height:18px;border-radius:2px;background:var(--lamp-off)}
.lvl-bar i.on{background:var(--tape)}

.teams{margin-top:12px;padding:16px;border:1px dashed var(--line);border-radius:8px;display:grid;gap:12px;background:var(--surface)}
.teams .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 14px;font-family:var(--f-mono)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.team-names{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.team-names label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.team-names input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;padding:12px 22px;font-family:var(--f-display);font-weight:600;font-size:17px;border:2px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 12px;font-size:14px;border-width:1px}
.btn.go{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* map: value stream */
.map-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.map-head h1{font-size:clamp(24px,4vw,34px)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vsm{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:8px 2px 16px}
.proc{flex:1 1 0;min-width:170px;display:flex;flex-direction:column;border:2px solid var(--ink);border-radius:4px;background:var(--surface);text-align:left;padding:0;position:relative;transition:transform .15s}
.proc:not([disabled]):hover{transform:translateY(-3px)}
.proc[disabled]{cursor:not-allowed;opacity:.55;border-style:dashed}
.proc .ph{background:var(--ink);color:var(--bg);padding:6px 10px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;display:flex;justify-content:space-between}
.proc .pb{padding:12px 10px;display:grid;gap:2px;flex:1}
.proc .pb b{font-family:var(--f-display);font-size:18px;line-height:1.25}
.proc .pb small{color:var(--muted);font-size:13px}
.proc .pd{border-top:2px solid var(--ink);display:grid;grid-template-columns:1fr 1fr;font-family:var(--f-mono);font-size:12px}
.proc .pd span{padding:5px 8px;border-bottom:1px solid var(--line)}
.proc .pd span:nth-child(odd){border-right:1px solid var(--line)}
.proc .pd .stars{grid-column:1/-1;border:0;font-size:16px;color:var(--tape);letter-spacing:2px}
.proc .pd .stars .off{color:var(--lamp-off)}
.proc.done{border-color:var(--go)}
.proc.done .ph{background:var(--go)}
.arrow{flex:0 0 40px;display:flex;align-items:center;justify-content:center}
.arrow i{display:block;width:100%;height:12px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 10px);clip-path:polygon(0 30%,70% 30%,70% 0,100% 50%,70% 100%,70% 70%,0 70%)}
.cust{flex:0 0 110px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);gap:4px}
.cust .fac{width:64px;height:44px;background:var(--tape);clip-path:polygon(0 30%,33% 0,33% 30%,66% 0,66% 30%,100% 0,100% 100%,0 100%)}
@media (max-width:760px){
  .vsm{flex-direction:column;overflow:visible}
  .proc{min-width:0}
  .arrow{flex-basis:28px}
  .arrow i{width:12px;height:100%;min-height:24px;background:repeating-linear-gradient(180deg,var(--ink) 0 6px,transparent 6px 10px);clip-path:polygon(30% 0,70% 0,70% 70%,100% 70%,50% 100%,0 70%,30% 70%)}
  .cust{flex-basis:auto;padding:8px}
}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:6px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}

/* quiz */
.quiz{display:grid;grid-template-columns:1fr 120px;gap:20px;align-items:start}
@media (max-width:640px){.quiz{grid-template-columns:1fr}}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pips{display:flex;gap:6px}
.pips i{width:26px;height:8px;border-radius:2px;background:var(--lamp-off)}
.pips i.ok{background:var(--go)}.pips i.ng{background:var(--stop)}.pips i.now{background:var(--tape)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:clamp(16px,3vw,28px);min-width:0}
.qtext{font-size:clamp(19px,2.6vw,24px);font-weight:600;line-height:1.5;margin-bottom:18px;font-family:var(--f-body)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:12px 14px;width:100%;transition:border-color .12s}
.opt:not([disabled]):hover{border-color:var(--blue)}
.opt .k{flex:0 0 28px;height:28px;display:grid;place-items:center;border-radius:4px;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:14px}
.opt .ot{min-width:0}
.opt.right{border-color:var(--go);background:var(--go-soft)}
.opt.right .k{background:var(--go)}
.opt.wrong{border-color:var(--stop);background:var(--stop-soft)}
.opt.wrong .k{background:var(--stop)}
.opt[disabled]{cursor:default}
.opt.static{cursor:default}

.feedback{margin-top:16px;border-radius:6px;padding:14px 16px;border-left:6px solid var(--go);background:var(--go-soft);display:grid;gap:6px}
.feedback.ng{border-left-color:var(--stop);background:var(--stop-soft)}
.feedback b{font-family:var(--f-display);font-size:18px}
.feedback .next{justify-self:start;margin-top:6px}

/* team pads */
.pads{display:grid;gap:10px;margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.pad{border:2px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:8px;background:var(--bg)}
.pad .pn{display:flex;justify-content:space-between;gap:6px;font-weight:600}
.pad .pk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad .pk button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 0;font-family:var(--f-mono);font-weight:600}
.pad .pk button:hover:not([disabled]){border-color:var(--blue)}
.pad.locked{border-color:var(--blue)}
.pad.locked .pk button{opacity:.45}
.pad.res-ok{border-color:var(--go);background:var(--go-soft)}
.pad.res-ng{border-color:var(--stop);background:var(--stop-soft)}
.pad .st{font-size:13px;color:var(--muted)}
.c1{--tc:#2356a3}.c2{--tc:#c2410c}.c3{--tc:#15803d}.c4{--tc:#7e22ce}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc);margin-right:6px}

/* andon tower */
.andon{display:grid;justify-items:center;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.tower{width:62px;display:grid;gap:3px;padding:6px;background:var(--sunk);border:2px solid var(--line);border-radius:8px 8px 4px 4px}
.lamp{height:34px;border-radius:4px;background:var(--lamp-off);transition:background .2s,box-shadow .2s}
.lamp.r.on{background:var(--stop);box-shadow:0 0 18px var(--stop)}
.lamp.y.on{background:var(--warn);box-shadow:0 0 18px var(--warn)}
.lamp.g.on{background:var(--go);box-shadow:0 0 18px var(--go)}
.lamp.blink{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{background:var(--lamp-off);box-shadow:none}}
.pole{width:8px;height:22px;background:var(--line)}
.timer-n{font-family:var(--f-mono);font-size:28px;font-weight:600;line-height:1}
.score-n{text-align:center}
.score-n b{display:block;font-family:var(--f-mono);font-size:22px}
@media (max-width:640px){
  .andon{position:static;grid-template-columns:auto auto 1fr;justify-items:start;align-items:center;order:-1}
  .tower{width:auto;grid-auto-flow:column;grid-template-columns:repeat(3,34px)}
  .lamp{height:20px}
  .pole{display:none}
  .score-n{text-align:right;justify-self:end}
}
@media (prefers-reduced-motion:reduce){.lamp.blink{animation:none}.proc{transition:none}}

/* result */
.result{display:grid;gap:20px}
.res-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.big-stars{font-size:46px;letter-spacing:6px;color:var(--tape);line-height:1}
.big-stars .off{color:var(--lamp-off)}
.status{display:inline-block;font-family:var(--f-mono);font-size:13px;padding:4px 10px;border-radius:4px;font-weight:600}
.status.pass{background:var(--go-soft);color:var(--go)}
.status.fail{background:var(--stop-soft);color:var(--stop)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--bg)}
.stat b{display:block;font-family:var(--f-mono);font-size:24px}
.rank{display:grid;gap:8px}
.rank-row{display:grid;grid-template-columns:40px 1fr auto auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.rank-row.first{border:2px solid var(--tape)}
.rank-row .pos{font-family:var(--f-mono);font-weight:600;font-size:18px}
.review{display:grid;gap:8px}
.review details{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg)}
.review summary{cursor:pointer;font-weight:500}
.review p{color:var(--muted);font-size:14px;margin-top:6px}
.note{color:var(--muted);font-size:13px;margin-top:24px}

/* nav */
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:8px;padding:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:6px;padding:6px 14px;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--stop);margin-right:6px;vertical-align:middle}

/* shared form fields */
.field{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field textarea,.field select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
.field textarea{resize:vertical;min-height:64px}
.qimg{display:block;max-width:100%;max-height:340px;border-radius:6px;margin:0 auto 16px;border:1px solid var(--line);object-fit:contain;background:var(--sunk)}

/* custom stages on map */
.sub-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:32px 0 12px}
.sub-h h2{font-size:22px}
.cgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.cgrid .proc{min-width:0}
.empty{border:2px dashed var(--line);border-radius:8px;padding:20px;color:var(--muted);display:grid;gap:10px;justify-items:start}

/* live */
.live-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.live-head h1{font-size:clamp(24px,4vw,34px)}
.notice{border-left:6px solid var(--tape);background:var(--surface);border-radius:6px;padding:14px 16px;display:grid;gap:6px;max-width:72ch}
.notice b{font-family:var(--f-display);font-size:18px}
.setup{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));align-items:end}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pchip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;animation:pop .3s ease-out}
.pchip.me{border-color:var(--blue);background:var(--blue-soft)}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:none;opacity:1}}
.bigcount{font-family:var(--f-mono);font-size:56px;font-weight:600;line-height:1}
.lq-text{font-size:clamp(22px,3.4vw,34px);font-weight:600;line-height:1.4;margin-bottom:18px;text-wrap:balance}
.lq-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lq-timer{font-family:var(--f-mono);font-size:40px;font-weight:600;min-width:2.2ch;text-align:center;border-radius:8px;padding:2px 14px;background:var(--go-soft);color:var(--go)}
.lq-timer.warn{background:var(--warn-soft);color:var(--warn)}
.lq-timer.stop{background:var(--stop-soft);color:var(--stop)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{display:flex;gap:12px;align-items:center;text-align:left;border:0;border-radius:8px;padding:16px;min-height:76px;background:var(--tc);color:#fff;font-size:18px;font-weight:600;position:relative;transition:transform .1s,opacity .2s}
.tile:not([disabled]):hover{transform:translateY(-2px)}
.tile:not([disabled]):active{transform:scale(.98)}
.tile .k{flex:0 0 34px;height:34px;display:grid;place-items:center;border-radius:6px;background:rgba(255,255,255,.22);font-family:var(--f-mono)}
.tile .tt{min-width:0}
.tile[disabled]{cursor:default}
.tile.dim{opacity:.28}
.tile.picked{outline:4px solid var(--ink);outline-offset:2px}
.tile.correct::after{content:"✓";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:28px}
.tile .cnt{margin-left:auto;font-family:var(--f-mono);background:rgba(0,0,0,.22);border-radius:4px;padding:2px 8px;font-size:15px}
.t1{--tc:#2356a3}.t2{--tc:#c2410c}.t3{--tc:#15803d}.t4{--tc:#7e22ce}
.board{display:grid;gap:6px}
.brow{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.brow.me{border:2px solid var(--blue)}
.brow .pos{font-family:var(--f-mono);font-weight:600;font-size:18px}
.brow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.brow .gain{font-family:var(--f-mono);font-size:13px;color:var(--go)}
.brow .gain.zero{color:var(--muted)}
.brow .sc{font-family:var(--f-mono);font-weight:600;font-size:18px;text-align:right;min-width:5ch}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;max-width:560px;margin:8px auto 20px}
.pod{display:grid;justify-items:center;gap:6px;text-align:center;min-width:0}
.pod .nm{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{width:100%;border-radius:6px 6px 0 0;background:var(--tape);color:var(--tape-ink);font-family:var(--f-mono);font-weight:600;display:grid;place-items:center;font-size:24px}
.pod.p1 .blk{height:140px}.pod.p2 .blk{height:100px;background:var(--line);color:var(--ink)}.pod.p3 .blk{height:72px;background:var(--sunk);color:var(--ink)}

.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
@media (max-width:800px){.two{grid-template-columns:1fr}}

/* editor */
.ed{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.ed{grid-template-columns:1fr}}
.setlist{display:grid;gap:6px}
.setlist button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px;display:grid;gap:2px}
.setlist button[aria-current="true"]{border:2px solid var(--blue);background:var(--blue-soft)}
.setlist small{color:var(--muted)}
.qed{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:14px;display:grid;gap:10px}
.qed-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.optrow{display:grid;grid-template-columns:auto 34px minmax(0,1fr);gap:8px;align-items:center}
.optrow input[type="radio"]{width:20px;height:20px;accent-color:var(--go)}
.optrow .k{height:30px;display:grid;place-items:center;border-radius:4px;color:#fff;background:var(--tc);font-family:var(--f-mono);font-size:14px}
.optrow input[type="text"]{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;width:100%}
.imgrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imgrow img{max-height:90px;max-width:160px;border-radius:4px;border:1px solid var(--line)}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);margin-top:8px}
.savebar .msg{font-size:14px;color:var(--muted)}
.savebar .msg.err{color:var(--stop)}
.bulk{border:1px dashed var(--line);border-radius:8px;padding:12px;background:var(--surface)}
.bulk summary{cursor:pointer;font-weight:600}
.bulk .field{margin-top:10px}
.errs{color:var(--stop);font-size:14px;margin:0;padding-left:20px}

/* ===== Sim hub ===== */
.sim-intro{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.sim-intro h1{font-size:clamp(26px,4.4vw,40px)}
.sim-intro p{color:var(--muted);max-width:60ch}
.who{display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.who .field{width:170px}
.games{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));margin-bottom:28px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gcard canvas{display:block;width:100%;aspect-ratio:16/9;max-width:100%;background:#1e2329}
.gcard .gb{padding:14px;display:grid;gap:8px;flex:1}
.gcard h3{font-size:21px}
.gcard .genre{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.gcard p{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;background:var(--sunk);border-radius:4px;padding:2px 8px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.lvls button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 4px;display:grid;gap:0;font-family:var(--f-display);font-weight:600}
.lvls button:hover{border-color:var(--ink)}
.lvls button small{font-size:13px;color:var(--tape);letter-spacing:1px}
.lvls button small .off{color:var(--lamp-off)}
.gcard .bgup{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.lb{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.lb-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.lb-h h2{font-size:22px}
.lb select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.lb .note2{font-size:13px;color:var(--muted)}

/* ===== play view ===== */
.sim-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sim-top h2{font-size:22px}
.sim-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#14181d}
.sim-wrap canvas{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation}
.sim-hud{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.hudi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;display:grid;line-height:1.2;min-width:84px}
.hudi span{font-size:11px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.hudi b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.hudi.alert b{color:var(--stop)}
.sim-ctl{display:grid;gap:12px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:760px){.sim-ctl{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.panel h3{font-size:15px;font-family:var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.acts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr))}
.act{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 8px;font-family:var(--f-display);font-weight:600;font-size:16px;display:grid;justify-items:center;gap:2px;line-height:1.2}
.act small{font-family:var(--f-body);font-weight:400;font-size:12px;opacity:.8}
.act.alt{background:var(--surface);color:var(--ink)}
.act:disabled{opacity:.35;cursor:not-allowed}
.act:not(:disabled):active{transform:scale(.97)}
.act .em{font-size:24px;line-height:1}
.shop{display:grid;gap:6px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--bg)}
.up b{font-size:14px}
.up small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.up button{border:1px solid var(--ink);background:var(--tape);color:var(--tape-ink);border-radius:6px;padding:6px 10px;font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.up button:disabled{background:var(--sunk);color:var(--muted);border-color:var(--line);cursor:not-allowed}
.up.owned{border-color:var(--go);background:var(--go-soft)}
.up.owned button{background:var(--go);color:#fff;border-color:var(--go)}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(20,24,29,.88);color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;pointer-events:none;max-width:90%;text-align:center;transition:opacity .3s}
.ovl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,15,.72);padding:16px;overflow:auto}
.ovl .box{background:var(--surface);color:var(--ink);border-radius:10px;padding:20px;max-width:560px;width:100%;display:grid;gap:12px;max-height:100%;overflow:auto}
.ovl h3{font-family:var(--f-display);font-size:24px}
.ovl ul{margin:0;padding-left:20px;display:grid;gap:6px}
.lesson{border-left:4px solid var(--tape);padding:4px 10px;background:var(--bg);border-radius:0 6px 6px 0;font-size:14px}
.joy{display:none}
@media (hover:none){.joy{display:grid}}
/* ===== Kaizen workshop ===== */
#kzArea:empty{display:none}
.kz-board{background:var(--surface);border:2px solid var(--tape);border-radius:10px;padding:16px;display:grid;gap:14px;margin-bottom:12px;scroll-margin-top:12px}
.kz-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.kz-head h3{font-family:var(--f-display);font-size:22px}
.kz-head p{color:var(--muted);font-size:14px;max-width:62ch}
.kz-total{text-align:right}.kz-total b{display:block;font-family:var(--f-mono);font-size:30px}
.kz-acts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.kz-act{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg);display:grid;gap:6px;align-content:start}
.kz-act.done{border-color:var(--go)}
.kz-act small{color:var(--muted);font-size:13px;line-height:1.4}
.kz-act .btn{justify-self:start}
.kz-ah{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.kz-tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;background:var(--ink);color:var(--bg);border-radius:4px;padding:2px 8px}
.kz-sc{font-family:var(--f-mono);font-size:11px;color:#fff;border-radius:4px;padding:2px 8px}
.kz-q{font-weight:600;font-size:16px}
.kz-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr))}
.kz-card{border:2px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 6px;display:grid;justify-items:center;gap:2px;text-align:center;font-size:14px}
.kz-card .em{font-size:30px;line-height:1.1}
.kz-card small{font-size:12px;color:var(--muted)}
.kz-card.s1{border-color:var(--go);background:var(--go-soft)}
.kz-card.s2{border-color:var(--stop);background:var(--stop-soft)}
.kz-legend{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.kz-rows{display:grid;gap:8px}
.kz-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--bg)}
.kz-it{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 200px;flex-wrap:wrap}
.kz-it .em{font-size:24px}
.kz-it small{color:var(--muted);font-size:12px;width:100%}
.kz-row .seg{flex-wrap:wrap}
.kz-row .seg button{font-family:var(--f-body);font-size:13px;padding:6px 10px}
.kz-shine-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.kz-shine{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:520px;padding:8px;border-radius:8px;background:linear-gradient(135deg,#aeb6bd,#7c868f)}
.kz-shine button{aspect-ratio:1;border:0;border-radius:4px;background:rgba(255,255,255,.18);font-size:22px}
.kz-shine button.dirty{background:radial-gradient(circle at 40% 40%,#5a4630 0 30%,#7a6244 45%,rgba(90,70,48,.6) 70%)}
.kz-shine button.clean{background:rgba(255,255,255,.55)}
.kz-shine button.abn{background:#fbefc8}
.kz-seq{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:640px){.kz-seq{grid-template-columns:1fr}}
.kz-list{display:grid;gap:6px;margin:6px 0 0;padding:0;list-style:none}
.kz-list.mine{counter-reset:k}
.kz-list button{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;font-size:14px}
.kz-list.mine li{display:flex;gap:6px;align-items:center;counter-increment:k}
.kz-list.mine li::before{content:counter(k);font-family:var(--f-mono);font-weight:600;width:22px;text-align:right}
.kz-list.mine button{border-color:var(--blue);background:var(--blue-soft)}
.kz-facts{display:flex;flex-wrap:wrap;gap:6px}
.kz-facts span{background:var(--sunk);border-radius:6px;padding:6px 10px;font-size:14px}
.kz-box{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;max-width:560px}
.kz-box span{aspect-ratio:1;border:2px dashed var(--line);border-radius:6px;display:grid;place-items:center;font-size:22px}
.kz-res{display:grid;justify-items:center;text-align:center;gap:2px}
.kz-big{font-family:var(--f-mono);font-size:48px;font-weight:600;line-height:1}
.kz-res p{color:var(--muted);font-size:14px;max-width:56ch}
.kz-sum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip-s{font-size:12px;font-family:var(--f-mono);background:var(--go-soft);color:var(--go);border-radius:4px;padding:3px 8px}
.chip-s.off{background:var(--sunk);color:var(--muted)}
.yama{display:flex;gap:8px;align-items:flex-end;overflow-x:auto;padding:4px 2px}
.ycol{flex:1 1 0;min-width:64px;display:grid;justify-items:center;gap:4px;text-align:center}
.ybar{position:relative;width:100%;max-width:70px;height:140px;background:var(--sunk);border-radius:4px;overflow:hidden}
.ybar i{position:absolute;left:0;right:0;bottom:0;border-radius:4px 4px 0 0;transition:height .3s}
.ybar b{position:absolute;left:-2px;right:-2px;height:3px;background:var(--stop);box-shadow:0 0 0 1px var(--surface)}
.ycol span{font-weight:600;font-size:14px}
.ycol small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ypm{display:inline-flex;align-items:center;gap:6px}
.ypm button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:600}
.ypm button:disabled{opacity:.35}
.ypm b{font-family:var(--f-mono);min-width:1.5ch;text-align:center}
.rpg-bar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:10px 0}
@media (max-width:640px){.rpg-bar{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rpg-bar .act{padding:8px 4px;font-size:13px}
.rpg-bar .act small{font-size:11px}
/* station designer */
.st-tabs{flex-wrap:wrap}
.st-tabs button{font-family:var(--f-body);font-size:13px;padding:7px 12px}
.st-tl{display:flex;height:30px;border-radius:6px;overflow:hidden;margin-top:8px;background:var(--sunk)}
.st-tl i{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;font-style:normal;font-size:11px;color:#fff;white-space:nowrap}
.st-tl i span{overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.st-va{background:#1d9152}.st-walk{background:#d97706}.st-search{background:#cf3a2e}.st-nva{background:#6b7280}.st-err{background:#7e22ce}
.st-kpi{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
/* center screen */
.center-grid{display:grid;gap:16px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px}
.ccard.off{opacity:.6}
.cc-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.cc-h b{font-family:var(--f-display);font-size:18px}.cc-h span{color:var(--muted);font-size:13px}
.cc-bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}.cc-bar i{display:block;height:100%;background:var(--tape)}
.cc-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;font-size:11px;color:var(--muted)}
.cc-kpi b{display:block;font-family:var(--f-mono);font-size:14px;color:var(--ink)}
.cc-yama{display:flex;gap:4px;height:70px;align-items:flex-end}
.cc-yama div{position:relative;flex:1;height:100%;background:var(--sunk);border-radius:3px}
.cc-yama i{position:absolute;left:0;right:0;bottom:0;border-radius:3px}
.cc-yama em{position:absolute;left:-1px;right:-1px;height:2px;background:var(--stop)}
.cc-yama small{position:absolute;top:2px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:10px}
.gemba{position:relative;width:100%;max-width:1000px;border-radius:8px;overflow:hidden;background:#222}
.gemba img{display:block;width:100%;height:100%;object-fit:cover}
.gs{position:absolute;border:0;background:transparent;padding:0;cursor:crosshair}
.gs:focus-visible{outline:3px solid var(--tape)}
.gs.bad{border:3px solid #ff3b2f;background:rgba(255,59,47,.12)}
.gs.good{border:3px solid #2fbf6b;background:rgba(47,191,107,.12)}
.gs span{position:absolute;left:0;top:0;max-width:220px;background:rgba(10,12,15,.85);color:#fff;font-size:12px;padding:2px 6px;border-radius:0 0 6px 0;text-align:left;line-height:1.3}
/* ===== training day ===== */
.tr-plan{display:grid;gap:10px;margin-bottom:16px}
.tr-slot{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tape);border-radius:8px;padding:12px 14px}

.tr-time{font-family:var(--f-mono);font-size:20px;font-weight:600}
.tr-slot b{font-family:var(--f-display);font-size:19px}
.tr-slot small{display:block;color:var(--muted);font-size:13px}
.tr-no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:13px;margin-right:8px;vertical-align:2px}
.tr-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tr-clock{text-align:center}.tr-clock b{display:block;font-family:var(--f-mono);font-size:22px}
.tr-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}
@media (max-width:860px){.tr-grid{grid-template-columns:1fr}}

.tr-opts.compact .tile{min-height:52px;font-size:15px;padding:10px 12px}
.tr-opts .tile.picked{outline:4px solid var(--ink);outline-offset:2px}

.tr-pads .pad .btn{justify-self:start}
.tr-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}

.tr-grid .qimg{max-height:240px}

.net-start h2{font-size:24px}
.net-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--surface);border:2px solid var(--tape);border-radius:10px;padding:12px 16px;margin-bottom:12px}
.net-code{display:block;font-family:var(--f-mono);font-size:44px;letter-spacing:.12em;line-height:1}
.net-bar small{color:var(--muted);font-size:13px;display:block;margin-top:4px}
.net-url{font-family:var(--f-mono);word-break:break-all}
.net-qr{background:#fff;padding:6px;border-radius:6px;line-height:0}
@media (max-width:1000px){.tr-slot{grid-template-columns:64px minmax(0,1fr)}.tr-slot .actions{grid-column:2}}
.tr-res{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:16px}
.tr-res small{display:block;color:var(--muted);font-size:13px;max-width:62ch}
/* ===== party mode (Live Quiz game show look) ===== */
body.party{background:#2a1a5e;background:radial-gradient(1200px 600px at 10% -10%,#7e3ff2 0,transparent 60%),radial-gradient(900px 600px at 110% 20%,#ff5a8a 0,transparent 55%),radial-gradient(900px 700px at 50% 120%,#1fb7c9 0,transparent 60%),#2a1a5e;background-attachment:fixed}
body.party .brand b,body.party .brand small,body.party #scrLive .live-head h1,body.party #scrLive .live-head .label,body.party .note{color:#fff}
body.party .brand small,body.party .note{opacity:.8}
body.party #scrLive::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.18;background-image:radial-gradient(circle at 20% 30%,#fff 0 3px,transparent 4px),radial-gradient(circle at 70% 60%,#fff 0 2px,transparent 3px),radial-gradient(circle at 40% 80%,#fff 0 2px,transparent 3px);background-size:180px 180px,260px 260px,220px 220px;animation:drift 40s linear infinite}
body.party #scrLive>*{position:relative;z-index:1}
@keyframes drift{to{background-position:180px 360px,-260px 260px,220px -440px}}
body.party #liveBox>.card,body.party #liveBox .card{border:0;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
/* shapes on answer tiles */
body.party .tile{border-radius:14px;min-height:96px;font-size:20px;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s,opacity .2s}
body.party .tile:not([disabled]):active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
body.party .tile .k{font-size:0;width:44px;height:44px;flex-basis:44px;background:rgba(255,255,255,.18);border-radius:10px}
body.party .tile .k::before{font-size:26px;color:#fff}
body.party .tile.t1{--tc:#e21b3c}body.party .tile.t2{--tc:#1368ce}body.party .tile.t3{--tc:#d89e00}body.party .tile.t4{--tc:#26890c}
body.party .tile.t1 .k::before{content:"▲"}body.party .tile.t2 .k::before{content:"◆"}body.party .tile.t3 .k::before{content:"●"}body.party .tile.t4 .k::before{content:"■"}
body.party .tile.correct{animation:bump .5s ease-out}
@keyframes bump{40%{transform:scale(1.04)}}
body.party .lq-text{font-size:clamp(24px,3.8vw,40px)}
/* ring timer */
body.party .lq-timer{--p:1;width:84px;height:84px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:32px;color:#1b222a;background:radial-gradient(closest-side,#fff 78%,transparent 80% 100%),conic-gradient(var(--rc,#26890c) calc(var(--p)*360deg),#e3e6ea 0)}
body.party .lq-timer.warn{--rc:#d89e00}body.party .lq-timer.stop{--rc:#e21b3c;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
/* lobby */
body.party .bigcount{font-size:72px}
body.party .pchip{font-size:18px;padding:8px 16px;border:0;background:#fff;color:#1b222a;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
/* player result splash */
body.party .me-res{border-radius:16px;padding:34px 16px;color:#fff;animation:splash .45s cubic-bezier(.3,1.5,.6,1)}
body.party .me-res.ok{background:linear-gradient(160deg,#2fbf6b,#15803d)}
body.party .me-res.ng{background:linear-gradient(160deg,#ef5a4c,#b4231a)}
body.party .me-res b{font-size:40px}
body.party .me-res .pts{font-size:34px;font-weight:700}
body.party .me-res .streak{background:rgba(0,0,0,.25);border-radius:999px;padding:4px 14px;font-weight:600}
@keyframes splash{from{transform:scale(.6);opacity:0}}
/* leaderboard bars */
body.party .brow.bar{position:relative;overflow:hidden;border:0;background:#f3f1fb;animation:slidein .45s both;animation-delay:var(--d)}
body.party .brow.bar::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:linear-gradient(90deg,rgba(126,63,242,.22),rgba(255,90,138,.22));transition:width .8s ease-out}
body.party .brow.bar>*{position:relative}
@keyframes slidein{from{transform:translateX(-30px);opacity:0}}
/* podium */
body.party .pod .blk{animation:rise .9s cubic-bezier(.3,1.3,.6,1) both;transform-origin:bottom}
body.party .pod.p2 .blk{animation-delay:.3s}body.party .pod.p3 .blk{animation-delay:.15s}body.party .pod.p1 .blk{animation-delay:.6s}
@keyframes rise{from{transform:scaleY(0)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.mute-btn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px}
@media (prefers-reduced-motion:reduce){body.party *{animation:none!important}}
@media (max-width:640px){body.party .top,body.party .tape,body.party #scrLive .live-head,body.party .note{display:none}body.party .wrap{padding-block:10px 24px}body.party .tile{min-height:84px}}
/* ---- pen factory ---- */
.pf-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pf-steps span{font-family:var(--f-mono);font-size:12px;padding:5px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pf-steps span.on{background:var(--ink);color:var(--bg)}
.pf-steps span.done{background:var(--go-soft);color:var(--go)}
.pf-goals{display:grid;gap:8px}
.pf-goal{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg)}
.pf-goal small{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.pf-goal .seg{flex-wrap:wrap}
.pf-goal .seg button{font-family:var(--f-body);font-size:13px;padding:6px 10px}
.pf-goal .seg small{display:inline;color:inherit;opacity:.7;font-family:var(--f-mono);font-size:11px;margin:0}
.pf-k{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:22px}
.pf-smart{font-size:13px;margin-top:6px;color:var(--ink)}
.pf-cands{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.pf-cand{display:grid;grid-template-columns:72px minmax(0,1fr);grid-template-rows:auto auto;gap:4px 10px;border:2px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);align-items:center}
.pf-cand.on{border-color:var(--go);background:var(--go-soft)}
.pf-cand canvas{grid-row:1/3;width:72px;height:auto;border-radius:6px}
.pf-cand small{display:block;color:var(--muted);font-size:12px}
.pf-cand .btn{justify-self:start}
.pf-cands.small{grid-template-columns:1fr}
.pf-sk{height:6px;background:var(--sunk);border-radius:3px;margin:3px 0;overflow:hidden}.pf-sk i{display:block;height:100%;background:var(--go)}
.pf-split{display:flex;align-items:stretch;gap:2px;overflow-x:auto;padding:4px 0}
.pf-task{min-width:58px;background:var(--blue-soft,#dbe6f7);border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center;font-size:12px;line-height:1.25}
.pf-task small{display:block;font-family:var(--f-mono);color:var(--muted);font-size:11px}
.pf-cut{flex:0 0 28px;border:1px dashed var(--line);background:var(--surface);border-radius:6px;font-size:14px;padding:0;min-height:44px}
.pf-cut.on{background:var(--stop);border-color:var(--stop);color:#fff;border-style:solid}
.pf-cut:disabled{opacity:.2}
.pf-stsel{flex-wrap:wrap}.pf-stsel button{font-family:var(--f-body);font-size:13px}
.pf-assign{display:grid;gap:6px}
.pf-w{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--bg)}
.pf-w.off{opacity:.5}.pf-w small{display:block;color:var(--muted);font-size:12px}
.pf-w .seg{flex-wrap:wrap}.pf-w .seg button{padding:6px 10px;min-width:40px}
.pf-alerts{display:grid;gap:6px}
.pf-names{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pEditor:not(:empty){margin-top:12px}
/* ---- Kahoot-style live ranking ---- */
.kb-wrap{display:grid;gap:14px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr)}
@media (max-width:900px){.kb-wrap{grid-template-columns:1fr}}
.kb{background:#1d1340;color:#fff;border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start}
.kb.main{background:linear-gradient(160deg,#46178f,#2a0f63)}
.kb h3{font-family:var(--f-display);font-size:20px}.kb h3 small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;opacity:.75}
.kb-list{position:relative;transition:height .4s}
.kb-row{position:absolute;left:0;right:0;height:40px;display:grid;grid-template-columns:34px minmax(0,1.2fr) minmax(0,1fr) auto 34px;gap:8px;align-items:center;background:rgba(255,255,255,.1);border-radius:8px;padding:0 8px;transition:top .7s cubic-bezier(.2,.8,.2,1)}
.kb-row.p1{background:linear-gradient(90deg,#f2b705,#c98f00);color:#1b222a}.kb-row.p2{background:linear-gradient(90deg,#cfd6dc,#9aa3ab);color:#1b222a}.kb-row.p3{background:linear-gradient(90deg,#d08a4f,#9b5d2c)}
.kb-row.me{outline:3px solid #7dffa8}.kb-row.off{opacity:.55}
.kb-pos{font-family:var(--f-mono);font-weight:700;font-size:18px;text-align:center}
.kb-nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kb-nm small{font-weight:400;opacity:.75;font-size:11px}
.kb-bar{height:10px;background:rgba(0,0,0,.25);border-radius:5px;overflow:hidden}.kb-bar i{display:block;height:100%;border-radius:5px;transition:width .7s}
.kb-bar i.c-s{background:#7dffa8}.kb-bar i.c-p{background:#38e070}.kb-bar i.c-l{background:#5ec8ff}.kb-bar i.neg{background:#ff6a5c}
.kb-v{font-family:var(--f-mono);font-size:15px;text-align:right;white-space:nowrap}
.kb-mv{font-family:var(--f-mono);font-size:12px;font-weight:700}.kb-mv.up{color:#7dffa8}.kb-mv.dn{color:#ff8a7a}
.kb-row.p1 .kb-mv.up,.kb-row.p2 .kb-mv.up{color:#0f6b38}
.kb-foot{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin:10px 0}
.pf-rank ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.pf-rank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:14px}
.pf-rank li small{grid-column:1;color:var(--muted);font-size:12px}.pf-rank li b{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--f-mono)}
.pf-rank li.me{border-color:var(--go);background:var(--go-soft)}
.pf-myrank{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}.pf-myrank b{font-family:var(--f-display);font-size:34px;line-height:1;color:#46178f}.pf-myrank span{color:var(--muted)}
.center-ctl{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:12px}
.center-ctl>p{width:100%;margin:0}
.lvls button.trainer{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lvls button.trainer:disabled{opacity:.5}
.lvls button.god{background:linear-gradient(135deg,#46178f,#9b2b22);color:#fff;border-color:transparent}
.pf-ev{border:2px solid var(--stop);border-radius:8px;padding:10px;background:var(--bg);display:grid;gap:6px}
.pf-ev .opt{text-align:left}
.howto-ovl{position:fixed;inset:0;z-index:50;background:rgba(10,12,15,.8);display:grid;place-items:center;padding:16px}
.howto-box{background:var(--surface);border-radius:12px;padding:16px;width:min(100%,960px);display:grid;gap:10px}
.howto-box video{width:100%;aspect-ratio:16/10;background:#000;border-radius:8px}
/* ---- 3D view ---- */
.sim-wrap.pf3d{aspect-ratio:16/10}
@media (max-width:640px){.sim-wrap.pf3d{aspect-ratio:3/4}}
.pf3d-canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.sim-wrap.pf3d{position:relative}
.sim-wrap:not(.pf3d) .pf3d-canvas{display:none}
.sim-wrap.pf3d::before{content:"";display:block;width:100%;aspect-ratio:inherit}
.pf-ovl{position:absolute;inset:0;pointer-events:none;font-family:var(--f-body)}
.pf-ovl-rank{position:absolute;right:8px;top:8px;background:rgba(20,12,52,.86);color:#fff;border-radius:10px;padding:8px 10px;display:grid;gap:3px;min-width:150px;max-width:62%;font-size:12px}
.pf-ovl-rank b{color:#ffd84d;font-size:13px}
.pf-ovl-rank span{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.pf-ovl-rank span i{font-style:normal;font-family:var(--f-mono);font-weight:700;text-align:center}
.pf-ovl-rank span.me{background:rgba(125,255,168,.22);border-radius:5px;padding:0 4px;margin:0 -4px}
.pf-ovl-rank em{font-style:normal;font-family:var(--f-mono);font-size:11px}
.pf-ovl-banner{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:rgba(15,18,22,.8);color:#fff;border-radius:12px;padding:10px 18px;text-align:center;min-width:60%}
.pf-ovl-banner b{display:block;color:#ffd84d;font-size:18px}.pf-ovl-banner span{font-size:13px}
.pf-ovl-ev{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#cf3a2e;color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;animation:pfBlink 1s steps(2) infinite;max-width:70%;text-align:center}
@keyframes pfBlink{to{background:#9b2b22}}
.pf-ovl-2d{position:absolute;left:8px;top:8px;pointer-events:auto;background:rgba(20,24,30,.75);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:4px 8px;font-family:var(--f-mono);font-size:12px}
.lvls button.ghost{background:var(--surface);color:var(--ink)}
/* =============== Lean Quest shell theme (fun, mobile-first) =============== */
:root{--bg:#eef2f8;--surface:#ffffff;--sunk:#e3e9f2;--ink:#15213a;--muted:#5b6b85;--line:#d6deea;--tape:#ffc233;--tape-ink:#15213a;--blue:#2a6df4;--blue-soft:#e3ecff;--go:#17a65a;--go-soft:#dcf5e7;--warn:#f59e0b;--warn-soft:#fff3d6;--stop:#e5484d;--stop-soft:#fde3e4;--r:16px;--sh:0 10px 30px rgba(21,33,58,.08),0 2px 6px rgba(21,33,58,.06);--f-display:"Kanit","IBM Plex Sans Thai",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1524;--surface:#18203a;--sunk:#222c4a;--ink:#eef2ff;--muted:#9aa8c7;--line:#2e3a5c;--blue:#6b9cff;--blue-soft:#1d2d55;--go:#3ad07e;--go-soft:#163a2b;--warn:#f5b73b;--warn-soft:#3d3014;--stop:#ff7a7e;--stop-soft:#43222a;--sh:0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0f1524;--surface:#18203a;--sunk:#222c4a;--ink:#eef2ff;--muted:#9aa8c7;--line:#2e3a5c;--blue:#6b9cff;--blue-soft:#1d2d55;--go:#3ad07e;--go-soft:#163a2b;--warn:#f5b73b;--warn-soft:#3d3014;--stop:#ff7a7e;--stop-soft:#43222a;--sh:0 10px 30px rgba(0,0,0,.35)}
body{background:radial-gradient(1200px 500px at 50% -200px,#dfe8ff 0,var(--bg) 60%) fixed}
.wrap.app{padding-bottom:96px}
.gtop{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);margin:-16px -16px 8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.mark{border-radius:12px;background:linear-gradient(135deg,#ffc233,#ff8a3d);box-shadow:0 4px 12px rgba(255,138,61,.35)}
.brand b{font-family:var(--f-display);letter-spacing:.02em}
.tape{display:none}
.tabs{background:transparent;padding:0;gap:2px}
.tabs button{border-radius:12px;padding:8px 14px;font-family:var(--f-display);font-weight:500;font-size:15px}
.tabs button i{font-style:normal;margin-right:6px}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.chip.xp{background:linear-gradient(135deg,#2a6df4,#6b4cf5);border:0;color:#fff;font-weight:600;cursor:default}
.btn{border-radius:14px;padding:12px 18px;font-family:var(--f-display);font-weight:500;letter-spacing:.01em;transition:transform .08s,box-shadow .15s}
.btn.go{background:linear-gradient(135deg,#ffc233,#ffa31a);color:#15213a;box-shadow:0 6px 18px rgba(255,163,26,.35);border:0}
.btn.go:active{transform:scale(.97)}
.btn.big{font-size:19px;padding:14px 24px}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.ghost{background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:600}
.sec-h{font-size:20px;margin:22px 0 10px}
/* home */
.hero-card{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:center;background:linear-gradient(135deg,#1b2b5c 0%,#2a6df4 55%,#5ec8ff 130%);color:#fff;border-radius:22px;padding:22px;box-shadow:0 18px 40px rgba(42,109,244,.28);overflow:hidden;position:relative}
.hero-card::after{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-card .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero-card h1{font-size:clamp(24px,4.6vw,38px);margin:4px 0 8px;color:#fff}
.hero-card p{opacity:.92;font-size:15px}
.hero-card .actions{margin-top:14px}
.hero-card .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
.hero-art{position:relative;z-index:1}
.h-thumb{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.35);transform:rotate(-2deg)}
@media (max-width:700px){.hero-card{grid-template-columns:1fr;padding:18px}.hero-art{order:-1}.h-thumb{transform:none}}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.strip-i{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}
.strip-i i{font-style:normal;font-size:26px}
.strip-i b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.15}
.strip-i small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
@media (max-width:560px){.strip{grid-template-columns:1fr 1fr}.strip-i:last-child{grid-column:1/-1}}
.tiles2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.tile2{position:relative;text-align:left;border:0;border-radius:var(--r);padding:18px 18px 18px 72px;min-height:96px;color:#fff;box-shadow:var(--sh);display:grid;gap:2px;align-content:center}
.tile2 i{font-style:normal;font-size:36px;position:absolute;left:18px;top:50%;transform:translateY(-50%)}
.tile2 b{font-family:var(--f-display);font-size:20px}
.tile2 small{opacity:.9}
.tile2 .go-arrow{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;opacity:.8}
.t-live{background:linear-gradient(135deg,#46178f,#8b3dff)}
.t-class{background:linear-gradient(135deg,#0e7c86,#17b3a3)}
.learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.learn-i{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--sh)}
.learn-i b{display:block;font-family:var(--f-display);font-size:15px}.learn-i small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.notice.soft{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-left-color:var(--blue)}
/* game cards */
.gcard{border-radius:var(--r);box-shadow:var(--sh);border:0;overflow:hidden}
.gcard.career{outline:3px solid var(--tape)}
.lvls button.trainer,.lvls button.god{border-radius:12px}
.lvls button.trainer{background:linear-gradient(135deg,#ffc233,#ffa31a);color:#15213a;border:0;font-family:var(--f-display);font-size:17px}
/* bottom nav (mobile) */
.bottom-nav{display:none}
@media (max-width:760px){

function prepQs(qs,shuf){

    const opts=(x.o||[]).map((t,k)=>({t:String(t||"").trim(),ok:k===x.c})).filter(o=>o.t);
    return {q:x.q,e:x.e||"",img:x.img||null,opts:shuffle(opts)};
  }).filter(x=>x.q&&x.opts.some(o=>o.ok));
}

function board(){

    Object.keys(keys).forEach(i=>{const x=a[i];const ok=Array.isArray(x)&&x[0]===keys[i];const pts=ok?ptsFor(x[1],T):0;s+=pts;if(ok)c++;if(+i===LIVE.idx)last=pts});

function tilesResult(withCounts,rows,myPick){
  const lq=LIVE.qs[LIVE.idx],key=(LIVE.keys||{})[LIVE.idx],cnt=[0,0,0,0];
  rows.forEach(r=>{if(r.answered&&cnt[r.pick]!=null)cnt[r.pick]++});
  return lq.o.map((t,k)=>`<div class="tile t${k+1} ${k===key?"correct":"dim"} ${k===myPick?"picked":""}"><span class="k">${KEYS[k]}</span><span class="tt">${esc(t)}</span>${withCounts?`<span class="cnt">${cnt[k]}</span>`:""}</div>`).join("");
}
function podiumHtml(rows){
  const top=rows.slice(0,3);if(!top.length)return "";
  const order=[1,0,2].filter(i=>top[i]);
  return `<div class="podium">${order.map(i=>`<div class="pod p${i+1}"><span class="nm">${esc(top[i].name)}</span><span class="num">${top[i].score.toLocaleString()}</span><div class="blk">${i+1}</div></div>`).join("")}</div>`;
}

// ----- host actions -----
async function hostWrite(patch){try{await CAP.db.doc("live/state").update(patch)}catch(e){const m=$("lvMsg");if(m)m.textContent="บันทึกไม่สำเร็จ ลองอีกครั้ง"}}
async function hostOpen(){
  const v=$("lvSrc").value.split(":"),T=+$("lvT").value;
  const src=v[0]==="train"?{kind:"train",id:v[1]}:v[0]==="stage"?{kind:"stage",i:+v[1]}:v[0]==="mix"?{kind:"mix",level:v[1]}:{kind:"custom",id:v.slice(1).join(":")};
  const lvl=S.level;if(v[0]==="stage")S.level=v[2];
  const info=srcInfo(src);S.level=lvl;if(!info)return;
  const qs=prepQs(info.qs,src.kind!=="custom");if(!qs.length){$("lvMsg").textContent="ชุดนี้ยังไม่มีคำถามที่สมบูรณ์";return}
  const gameId=rid();
  const secret={gameId,keys:qs.map(q=>q.opts.findIndex(o=>o.ok)),ex:qs.map(q=>q.e||"")};
  $("lvOpen").disabled=true;$("lvMsg").textContent="กำลังเปิดห้อง…";
  try{
    await CAP.db.doc("live/secret").set(secret);SECRET=secret;
    await CAP.db.doc("live/state").set({gameId,status:"lobby",title:info.title,T,idx:-1,startedAt:0,keys:{},ex:{},qs:qs.map(q=>({q:q.q,img:q.img||null,o:q.opts.map(o=>o.t)}))});
  }catch(e){$("lvOpen").disabled=false;$("lvMsg").textContent="เปิดห้องไม่สำเร็จ ("+(e&&e.code||"error")+") ลองอีกครั้ง"}
}
function hostStartQ(i){revealing=-1;return hostWrite({status:"question",idx:i,startedAt:Date.now()})}
async function hostReveal(){
  if(!LIVE||LIVE.status!=="question"||revealing===LIVE.idx)return;
  revealing=LIVE.idx;
  if(!SECRET||SECRET.gameId!==LIVE.gameId){try{const s=await CAP.db.doc("live/secret").get();SECRET=s.exists?s.data():null}catch(e){}}
  if(!SECRET||SECRET.gameId!==LIVE.gameId){revealing=-1;return}
  const i=LIVE.idx,keys=Object.assign({},LIVE.keys||{}),ex=Object.assign({},LIVE.ex||{});
  keys[i]=SECRET.keys[i];ex[i]=SECRET.ex[i]||"";
  await hostWrite({status:"reveal",keys,ex});
}
async function hostClose(){try{await CAP.db.doc("live/state").set({status:"idle",gameId:null})}catch(e){}}

// ----- player actions -----
function joinGame(){
  if(!LIVE||!LIVE.gameId)return;
  if(ME.g!==LIVE.gameId){ME.g=LIVE.gameId;ME.ans=lsGet("lq-ans-"+LIVE.gameId,{})}
  {const pf=lsGet("lq-sim-who",{});CAP.room.presence({g:ME.g,n:ME.name,e:pf.emp||"",tm:pf.team||"",a:ME.ans}).catch(()=>{})}
  renderLive(true);
}
function playerPick(k){
  if(!LIVE||LIVE.status!=="question")return;
  const i=LIVE.idx;if(ME.ans[i]!=null||liveRemain()<=0)return;
  const ms=Math.round(T0==null?0:performance.now()-T0);
  ME.ans[i]=[k,ms];lsSet("lq-ans-"+ME.g,ME.ans);
  CAP.room.presence({a:ME.ans}).catch(()=>{});
  renderLive();
}

// ----- live loop: timers + host auto-reveal -----
setInterval(()=>{
  if(!LIVE||LIVE.status!=="question"||$("scrLive").hidden&&ROLE!=="host")return;
  const r=liveRemain(),el=$("lvTimer");
  if(el){el.textContent=Math.ceil(r);el.className="lq-timer"+(r/(LIVE.T||20)<=.25?" stop":r/(LIVE.T||20)<=.5?" warn":"");el.style.setProperty("--p",Math.max(0,r/(LIVE.T||20)))}
  if(window.PARTY)PARTY.tick(r);
  if(ROLE==="player"&&liveView.startsWith("p-q"))UPD["p-q"]();
  if(ROLE==="host"&&CAP.canEdit){const rows=board();if(r<=0||(rows.length&&rows.every(x=>x.answered)))hostReveal()}
},200);

function onLiveState(){
  if(LIVE&&LIVE.status==="question"&&T0idx!==LIVE.gameId+":"+LIVE.idx){T0idx=LIVE.gameId+":"+LIVE.idx;T0=performance.now()}
  // keep my presence aligned with the current game
  if(CAP.room&&LIVE&&LIVE.gameId&&ME.name&&ME.g&&ME.g!==LIVE.gameId){ME.g=LIVE.gameId;ME.ans=lsGet("lq-ans-"+LIVE.gameId,{});CAP.room.presence({g:ME.g,n:ME.name,a:ME.ans}).catch(()=>{})}
  const dot=document.querySelector('#tabs [data-tab="live"] .live-dot');if(dot)dot.hidden=!(LIVE&&LIVE.gameId&&LIVE.status!=="idle");
  renderLive();
}

function validate(d){
  const errs=[];if(!d.title.trim())errs.push("ใส่ชื่อชุดคำถาม");
  if(!d.qs.length)errs.push("ต้องมีอย่างน้อย 1 คำถาม");
  d.qs.forEach((q,i)=>{const filled=q.o.filter(x=>String(x||"").trim()).length;
    if(!q.q.trim())errs.push(`ข้อ ${i+1}: ยังไม่มีคำถาม`);
    else if(filled<2)errs.push(`ข้อ ${i+1}: ต้องมีตัวเลือกอย่างน้อย 2 ข้อ`);
    else if(!String(q.o[q.c]||"").trim())errs.push(`ข้อ ${i+1}: ตัวเลือกที่ตั้งเป็นคำตอบถูกยังว่าง`)});
  return errs;
}
async function writeBank(sets){
  ED.msg="กำลังบันทึก…";ED.err=false;const m=$("edMsg");if(m)m.textContent=ED.msg;
  if(CAP.db&&!window.LQ_STANDALONE){try{await CAP.db.doc("qbank/main").set({sets,updatedAt:Date.now()})}catch(e){ED.err=true;ED.msg=e&&e.code==="invalid_argument"?"บันทึกไม่สำเร็จ ชุดคำถามอาจใหญ่เกินไป หรือคุณไม่มีสิทธิ์แก้ไข":"บันทึกไม่สำเร็จ ลองอีกครั้ง";renderEditor();return false}}
  else lsSet("leanquest-bank",sets);
  BANK.sets=sets;ED.dirty=false;ED.msg="บันทึกแล้ว · เล่นได้ที่แท็บเล่นเกม และเลือกใน Live Quiz ได้";renderCustomGrid();return true;
}
async function saveDraft(){
  const d=ED.draft;const errs=validate(d);
  if(errs.length){ED.err=true;ED.msg=errs.slice(0,3).join(" · ")+(errs.length>3?` (และอีก ${errs.length-3})`:"");renderEditor();return}
  d.title=d.title.trim();d.qs=d.qs.map(q=>({q:q.q.trim(),o:q.o.map(x=>String(x||"").trim()),c:q.c,e:(q.e||"").trim(),img:q.img||null}));
  const sets=BANK.sets.slice();const i=sets.findIndex(s=>s.id===d.id);if(i>=0)sets[i]=JSON.parse(JSON.stringify(d));else sets.push(JSON.parse(JSON.stringify(d)));
  if(await writeBank(sets))renderEditor();
}

async function boot(){
  let c=window.claude,tries=0;
  while((!c||!c.use)&&tries<30&&!window.LQ_STANDALONE){await new Promise(r=>setTimeout(r,100));c=window.claude;tries++}
  if(c&&c.use){
    const [db,user,room,assets]=await Promise.all(["db","user","room","assets"].map(n=>c.use(n).catch(()=>null)));
    Object.assign(CAP,{db,user,room,assets});
    if(user){try{CAP.canEdit=!!(await user.canEdit())}catch(e){}try{CAP.uid=await user.id()}catch(e){}}
  }
  CAP.ready=true;ROLE=CAP.canEdit?"host":"player";
  if(CAP.db){
    CAP.db.doc("qbank/main").onSnapshot(s=>{const d=s.exists?s.data():null;BANK.sets=d&&Array.isArray(d.sets)?d.sets:[];
      if(ED.draft&&!ED.dirty){const fresh=BANK.sets.find(x=>x.id===ED.draft.id);ED.draft=fresh?JSON.parse(JSON.stringify(fresh)):null}
      if(!$("scrEditor").hidden&&!ED.dirty)renderEditor();if(liveView==="h-idle")renderLive(true)},()=>{});
    CAP.db.doc("live/state").onSnapshot(s=>{LIVE=s.exists?s.data():null;onLiveState()},()=>{});
  }
  if(CAP.room){
    CAP.room.onPeers(ch=>{PEERS=ch.peers;renderLive()},()=>{});
  }
  renderLive();if(!$("scrEditor").hidden)renderEditor();if(!$("scrSims").hidden&&window.SIMHUB)SIMHUB.open(true);
}

  const qs=g.rounds.map(r=>{let right,pool;
    if(r.k==="choice")return {q:r.q,o:[r.opts[r.a]].concat(r.opts.filter((_,i)=>i!==r.a)).slice(0,4),c:0,e:r.why,img:r.img||null};
    if(r.multi){right=r.a.join(", ");pool=SMART_COMBOS.filter(x=>x!==right);const lead=r.q.replace(/ \(เลือกได้หลายข้อ\)/,"");return {q:lead+" (เลือกชุดคำตอบที่ถูก)",o:[right].concat(shuffle(pool).slice(0,3)),c:0,e:r.why}}
    const O=TR_OPT[r.k],ri=O.findIndex(x=>x[0]===r.a);right=O[ri][1];pool=O.filter((_,i)=>i!==ri).map(x=>x[1]);
    return {q:r.q,o:[right].concat(shuffle(pool).slice(0,3)),c:0,e:r.why,img:r.img||null}});
  return {title:g.title,tag:"TRAIN",qs};
}

// ---------------- Party mode: game-show look, sounds, confetti for Live Quiz ----------------
const PARTY=(()=>{
  let ac=null,muted=false,lastView="",lastSec=-1,lastJoin=0;
  try{muted=localStorage.getItem("lq-mute")==="1"}catch(e){}
  const ensure=()=>{if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume()};
  document.addEventListener("pointerdown",ensure,{passive:true});
  function tone(f,d,type,vol,when){if(muted||!ac)return;const t=ac.currentTime+(when||0),o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
  const SFX={tick:()=>tone(880,.08,"square",.06),pop:()=>{tone(520,.08,"triangle",.12);tone(780,.1,"triangle",.1,.06)},
    go:()=>[523,659,784].forEach((f,i)=>tone(f,.18,"triangle",.14,i*.09)),
    right:()=>[659,784,1047].forEach((f,i)=>tone(f,.22,"sine",.18,i*.1)),wrong:()=>{tone(196,.35,"sawtooth",.08);tone(147,.4,"sawtooth",.07,.12)},
    reveal:()=>tone(392,.25,"triangle",.12),fanfare:()=>[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.14,i*.13))};
  function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
  // confetti
  let cv=null,parts=[],raf=0;
  function confetti(n){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;if(!cv){cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv)}
    cv.width=innerWidth;cv.height=innerHeight;const cols=["#f2b705","#2fbf6b","#2356a3","#e5483b","#7e22ce","#ffffff"];
    for(let i=0;i<(n||160);i++)parts.push({x:innerWidth*Math.random(),y:-20-Math.random()*innerHeight*.4,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*7,h:8+Math.random()*10,c:cols[i%cols.length]});
    if(!raf)loop()}
  function loop(){const c=cv.getContext("2d");c.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()});
    parts=parts.filter(p=>p.y<cv.height+30);if(parts.length)raf=requestAnimationFrame(loop);else{raf=0;c.clearRect(0,0,cv.width,cv.height)}}
  const AV=["🦊","🐼","🐯","🦁","🐸","🐵","🐧","🦉","🐙","🦄","🐳","🐝","🐢","🦖","🐨","🐰","🦀","🐬","🐞","🦜"];
  const avatar=n=>{let h=0;for(const ch of String(n))h=(h*31+ch.charCodeAt(0))>>>0;return AV[h%AV.length]};
  function streakOf(){if(!LIVE||!LIVE.keys)return 0;let s=0;for(let i=LIVE.idx;i>=0;i--){const a=ME.ans[i],k=LIVE.keys[i];if(k==null)continue;if(Array.isArray(a)&&a[0]===k)s++;else break}return s}
  function countUp(el,to){if(!el)return;const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/700);el.textContent="+"+Math.round(to*k*(2-k));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
  function muteBtn(){let b=document.getElementById("lqMute");if(!b){b=document.createElement("button");b.id="lqMute";b.type="button";b.className="mute-btn";b.onclick=()=>{muted=!muted;try{localStorage.setItem("lq-mute",muted?"1":"0")}catch(e){}b.textContent=muted?"🔇":"🔊";ensure()};document.body.appendChild(b)}b.textContent=muted?"🔇":"🔊";b.hidden=$("scrLive").hidden||ROLE!=="host"}
  function after(v){
    const on=!$("scrLive").hidden&&LIVE&&LIVE.gameId&&LIVE.status!=="idle";document.body.classList.toggle("party",!!on);muteBtn();
    if(!on){lastView=v;return}
    const base=v.replace(/-\d+$/,""),changed=v!==lastView;
    // decorate tiles with shapes (CSS) and lobby avatars
    document.querySelectorAll("#lvPlayers .pchip").forEach(ch=>{if(!ch.dataset.av){ch.dataset.av=1;ch.textContent=avatar(ch.textContent)+" "+ch.textContent}});
    if(base==="h-lobby"){const n=document.querySelectorAll("#lvPlayers .pchip").length;if(n>lastJoin)SFX.pop();lastJoin=n}
    if(changed){
      if(base==="h-q"||base==="p-q"){SFX.go();lastSec=-1}
      if(base==="h-r")SFX.reveal();
      if(base==="p-r"){const a=ME.ans[LIVE.idx],ok=Array.isArray(a)&&a[0]===(LIVE.keys||{})[LIVE.idx];if(ok){SFX.right();vib([60,40,60]);confetti(70)}else{SFX.wrong();vib(250)}
        const pts=document.querySelector("#lvMe .me-res .pts");if(pts)countUp(pts,parseInt(pts.textContent.replace(/\D/g,""))||0)}
      if(base==="h-end"||base==="p-end"){SFX.fanfare();confetti(220)}}
    if(base==="p-r"){const box=document.querySelector("#lvMe .me-res.ok");if(box&&!box.querySelector(".streak")){const st=streakOf();if(st>=2)box.insertAdjacentHTML("beforeend",`<span class="streak">🔥 ตอบถูกติดกัน ${st} ข้อ</span>`)}}
    // leaderboard bars + crown
    document.querySelectorAll("#lvBoard .board").forEach(bd=>{const rows=[...bd.querySelectorAll(".brow")],mx=Math.max(1,...rows.map(r=>parseInt((r.querySelector(".sc")||{}).textContent?.replace(/\D/g,"")||"0")));
      rows.forEach((r,i)=>{const sc=parseInt(r.querySelector(".sc").textContent.replace(/\D/g,""))||0;r.style.setProperty("--w",(sc/mx*100)+"%");r.style.setProperty("--d",(i*.06)+"s");r.classList.add("bar");const nm=r.querySelector(".nm");if(nm&&!nm.dataset.av){nm.dataset.av=1;nm.textContent=(i===0&&sc>0?"👑 ":"")+avatar(nm.textContent.replace(" (คุณ)",""))+" "+nm.textContent}})});
    lastView=v}
  function tick(r){const s=Math.ceil(r);if(s!==lastSec){lastSec=s;if(s<=5&&s>0)SFX.tick()}}
  return {after,tick,confetti,SFX,ensure};
})();

// CLOUD — shared scoreboard on Google Sheets (Apps Script web app). Works without login; queues offline.

const CLOUD=(()=>{
  const url=()=>{try{return localStorage.getItem("lq-sheet-url")||window.LQ_SHEET_URL||""}catch(e){return window.LQ_SHEET_URL||""}};
  const who=()=>Object.assign({name:"",team:"",emp:""},lsGet("lq-sim-who",{}));
  const dev=()=>{let d="";try{d=localStorage.getItem("lq-dev")||"";if(!d){d=Math.random().toString(36).slice(2,10);localStorage.setItem("lq-dev",d)}}catch(e){}return d};
  let cache=null,cacheAt=0;
  function enabled(){return !!url()}
  async function send(rows){if(!enabled())return false;try{const r=await fetch(url(),{method:"POST",body:JSON.stringify({rows})});const j=await r.json().catch(()=>null);return !!(j&&j.ok)}catch(e){return false}}
  async function flush(){const q=lsGet("lq-cloud-q",[]);if(!q.length||!enabled())return;if(await send(q))lsSet("lq-cloud-q",[])}
  function post(o){const w=who(),days=lsGet("lq-streak",{days:[]}).days.length;const row=Object.assign({ts:Date.now(),dev:dev(),emp:w.emp||"",name:w.name||"ผู้เล่น",team:w.team||"",days},o);const q=lsGet("lq-cloud-q",[]);q.push(row);lsSet("lq-cloud-q",q.slice(-200));flush()}
  function postLive(gameId,title,players){if(!enabled())return;const rows=players.map(p=>({ts:Date.now(),dev:"live",emp:p.emp||"",name:p.name,team:p.team||"",game:"live",stage:0,score:p.score,title,gid:gameId}));send(rows)}
  async function board(force){if(!enabled())return null;if(!force&&cache&&Date.now()-cacheAt<30000)return cache;try{const r=await fetch(url()+(url().includes("?")?"&":"?")+"season=current&_="+Date.now());const j=await r.json();if(j&&j.rows){cache=j;cacheAt=Date.now();return j}}catch(e){}return cache}
  async function admin(pin,q){if(!enabled())return null;try{const r=await fetch(url()+(url().includes("?")?"&":"?")+"admin="+encodeURIComponent(pin)+"&"+(q||"")+"&_="+Date.now());return await r.json()}catch(e){return null}}
  async function test(u){try{const r=await fetch(u+"?ping=1&_="+Date.now());const j=await r.json();return !!(j&&j.ok)}catch(e){return false}}
  setTimeout(flush,2000);window.addEventListener("online",flush);
  return {post,postLive,board,admin,flush,enabled,test,url,setUrl(u){try{if(u)localStorage.setItem("lq-sheet-url",u);else localStorage.removeItem("lq-sheet-url")}catch(e){}cache=null}};
})();

    if(step===3){const pool=TASKS.filter(t=>!d.seq.includes(t.id));P.innerHTML=`<p class="kz-q">แตะขั้นตอนเพื่อเรียงลำดับ ลองสลับลำดับแล้วดูเวลาและเส้นทางมือที่เปลี่ยนไป</p><div class="kz-seq"><div><span class="label">ขั้นตอนที่ยังไม่ได้ใส่</span><div class="kz-list">${pool.map(t=>`<button type="button" data-a="${t.id}">${t.n} <small>(${t.va?"เพิ่มคุณค่า":"ไม่เพิ่มคุณค่า"} ${t.h}s)</small></button>`).join("")||`<span class="label">ใส่ครบแล้ว</span>`}</div></div>
      <div><span class="label">ลำดับมาตรฐาน (OIS) ของคุณ</span><ol class="kz-list mine">${d.seq.map((id,i)=>`<li><button type="button" data-r="${id}">${TK(id).n}</button><span class="ypm"><button type="button" data-up="${i}" ${i?"":"disabled"} aria-label="เลื่อนขึ้น">↑</button><button type="button" data-dn="${i}" ${i<d.seq.length-1?"":"disabled"} aria-label="เลื่อนลง">↓</button></span></li>`).join("")||`<span class="label">ยังว่าง</span>`}</ol></div></div>

    if(R.risky)t.push(`<b>Safety:</b> เอื้อมนอกระยะ ${R.risky} ครั้งต่อด้าม ถ้าวันละ 1,000 ด้ามคือเอี้ยวตัว ${(R.risky*1000).toLocaleString()} ครั้ง`);
    if(T.move>7)t.push(`<b>Motion:</b> มือเคลื่อนที่ ${T.move.toFixed(1)} วินาที/ด้าม ย้ายกล่องที่หยิบต่อเนื่องกันให้อยู่ใกล้กันและใกล้จิ๊ก`);
    if(T.search>3)t.push(`<b>ค้นหา:</b> เสียเวลาหาและเขี่ยของ ${T.search.toFixed(1)} วินาที/ด้าม`);
    if(R.riskRefill>.02)t.push(`<b>Poka-yoke:</b> โอกาสหยิบไส้ผิดสี ${(R.riskRefill*100).toFixed(1)}% แยกช่องตามสีจะเหลือต่ำกว่า 1%`);
    return t}
  function upd(){R=evalBench(d);const T=R.T,tot=Math.max(1,R.ct);$("bnCT").textContent=R.ok?R.ct.toFixed(1)+"s":"-";
    $("bnTL").innerHTML=R.ok?[["va","ประกอบ (เพิ่มคุณค่า)",T.va],["walk","มือเคลื่อนที่/เอื้อม",T.move],["search","ค้นหา/เขี่ย",T.search],["nva","หยิบ ทดสอบ แพ็ค",T.nva]].map(([k,n,v])=>v>.05?`<i class="st-${k}" style="flex:${v}" title="${n} ${v.toFixed(1)}s"><span>${n} ${v.toFixed(1)}s</span></i>`:"").join(""):"";
    $("bnKPI").innerHTML=[["งานเพิ่มคุณค่า",R.ok?Math.round(T.va/tot*100)+"%":"-"],["ท่าทางเสี่ยง/ด้าม",R.risky],["หยิบไส้ผิดสี",(R.riskRefill*100).toFixed(1)+"%"],["ของรกบนโต๊ะ",R.messy+" ชิ้น"]].map(h=>`<div class="hudi ${h[0]==="ท่าทางเสี่ยง/ด้าม"&&h[1]?"alert":""}"><span>${h[0]}</span><b>${h[1]}</b></div>`).join("");
    $("bnTabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.s===step));$("bnPrev").disabled=step===0;$("bnNext").style.display=step===4?"none":"";
    $("bnUse").disabled=!R.ok;panel();redraw()}
  function play(){if(!R.ok)return;cancelAnimationFrame(animH);const pts=R.pts,seg=[];let t=0;for(let i=1;i<pts.length;i++){const m=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y)/PXCM/80+.35;seg.push({a:pts[i-1],b:pts[i],t0:t,t1:t+m});t+=m}
    const st=performance.now(),f=()=>{const e=(performance.now()-st)/1000,s=seg.find(q=>e<q.t1)||seg[seg.length-1],k=Math.min(1,Math.max(0,(e-s.t0)/Math.max(.01,s.t1-s.t0-.3)));anim={x:s.a.x+(s.b.x-s.a.x)*k,y:s.a.y+(s.b.y-s.a.y)*k};redraw();if(e<t)animH=requestAnimationFrame(f);else{anim=null;redraw()}};f()}
  $("bnTabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{step=+b.dataset.s;sel=null;upd()});
  $("bnPrev").onclick=()=>{step=Math.max(0,step-1);sel=null;upd()};$("bnNext").onclick=()=>{step=Math.min(4,step+1);sel=null;upd()};
  $("bnUse").onclick=()=>{if(!R.ok)return;cancelAnimationFrame(animH);onDone(R,Math.min(1,IDEAL_CT/R.ct))};
  upd();el.scrollIntoView({block:"start",behavior:"smooth"});
}

    function layoutCanvas(wrap,S,selSt,onCell){const LW=960,LH=330,cs=104,ox=150,oy=24;const cv=document.createElement("canvas"),dpr=Math.min(2,window.devicePixelRatio||1);cv.width=LW*dpr;cv.height=LH*dpr;cv.style.aspectRatio=LW+"/"+LH;const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);wrap.appendChild(cv);

      const pts=[rp].concat(S.map(x=>XY(x.cell))).concat([sp]);c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=3;c.setLineDash([9,6]);c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke();c.setLineDash([]);

          <div class="eq-stat"><span>น้ำหนักที่สวม</span><b class="${ld>cap?"over":""}">${ld} / ${cap}</b></div>
          <div class="eq-load"><i style="width:${Math.min(100,ld/cap*100)}%;background:${ld>cap?"#e5484d":ld>cap*.7?"#f5b73b":"#7dffa8"}"></i></div>
          <small class="eq-note">${ld>cap?"หนักเกินไป ผลพิเศษเหลือครึ่งเดียว":"ขีดจำกัดน้ำหนักเพิ่มตามระดับ CPS"}</small>
          <div class="eq-title sm" style="margin-top:12px">รูปร่าง</div>
          <div class="eq-body"><div class="seg">${[["m","ชาย"],["f","หญิง"]].map(g=>`<button type="button" data-bg="${g[0]}" aria-pressed="${(p.body||{}).g===g[0]||(!p.body&&g[0]==="m")}">${g[1]}</button>`).join("")}</div>
            <div class="eq-skins">${["#f1cfae","#e6b993","#d6a27a","#b9805a","#8d5a3b"].map(c=>`<button type="button" data-skin="${c}" style="--s:${c}" aria-pressed="${((p.body||{}).skin||"#e6b993")===c}"></button>`).join("")}</div></div>
        </section></div>
      <footer class="eq-foot"><span>แตะช่องเพื่อเลือก</span><span>✓ สวมใส่</span><span>🔒 ปลดล็อกด้วยการเล่น</span></footer></div>`;
    $("eqBack").onclick=()=>goTab("profile");
    $("eqBody").querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{sel={slot:b.dataset.slot,item:null};render()});
    $("eqBody").querySelectorAll("[data-it]").forEach(b=>b.onclick=()=>{const id=b.dataset.it;if(id==="__none"){sel.item=null;const e=get();e[sel.slot]=null;lsSet(KEY,e);render();return}sel.item=id;render()});
    if($("eqOn"))$("eqOn").onclick=()=>{const e=get();if(slot.charm){["charm1","charm2","charm3"].forEach(s=>{if(e[s]===cur.id)e[s]=null})}e[sel.slot]=cur.id;lsSet(KEY,e);syncHat(e);try{if(window.PARTY)PARTY.SFX.pop()}catch(er){}render()};
    if($("eqOff"))$("eqOff").onclick=()=>{const e=get();e[sel.slot]=slot.charm?null:sel.slot==="gloves"?"gl_none":sel.slot==="glasses"?"gs_none":e[sel.slot];lsSet(KEY,e);sel.item=null;render()};
    $("eqBody").querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{const q=lsGet("lq-sim-who",{});q.body=Object.assign({g:"m",skin:"#e6b993",hair:"#2b1f17"},q.body||{},{g:b.dataset.bg});lsSet("lq-sim-who",q);render()});
    $("eqBody").querySelectorAll("[data-skin]").forEach(b=>b.onclick=()=>{const q=lsGet("lq-sim-who",{});q.body=Object.assign({g:"m",skin:"#e6b993",hair:"#2b1f17"},q.body||{},{skin:b.dataset.skin});lsSet("lq-sim-who",q);render()})}
  function syncHat(e){const h=item(e.helmet);if(h){const q=lsGet("lq-sim-who",{});q.hat=h.col;lsSet("lq-sim-who",q)}}
  function newUnlocks(){const x=ctx(),seen=lsGet("lq-equip-seen",[]),now=ITEMS.filter(i=>i.lock&&unlocked(i,x)).map(i=>i.id),fresh=now.filter(id=>!seen.includes(id));return {fresh:fresh.map(item),mark(){lsSet("lq-equip-seen",now)}}}
  return {open,render,icon,portrait,bonus,look3d,get,item,ITEMS,newUnlocks,unlocked};
})();

hud();
(function route(){const h=location.hash;
  if(h==="#sims"||/^#f\d{4}$/.test(h)){show("scrSims");SIMHUB.open()}
  else if(h==="#center"){show("scrSims");SIMHUB.open();setTimeout(()=>SIMHUB.center(),300)}
  else if(h==="#live"||/^#j\d{4}$/.test(h)||/^#host/.test(h)){show("scrLive")}
  else if(h==="#editor"){show("scrEditor")}
  else if(h==="#rank"){show("scrRank");renderRank()}
  else if(h==="#equip"){EQUIP.open()}
  else {show("scrHome");renderHome()}
  document.querySelectorAll("#tabs button,#bnav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===TAB_OF[SCREENS.find(s=>!$(s).hidden)]?"page":"false"))})();
